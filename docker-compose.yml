services:
  postgres:
    image: postgres:16-alpine
    container_name: device-management-be-postgres
    environment:
      POSTGRES_DB: device_management_be
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - device-management-be-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  device-management-be-pgdata: